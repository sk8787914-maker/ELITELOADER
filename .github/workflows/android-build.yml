name: Android APK Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.4" \
            "ndk;24.0.8215888"

      - name: Create CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/loader-release.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias loader \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=ELITELOADER CI, OU=Build, O=ELITELOADER, L=NA, ST=NA, C=US"

      - name: Build debug and release APKs
        env:
          STORE_FILE: ${{ runner.temp }}/loader-release.jks
          STORE_PASSWORD: changeit
          KEY_ALIAS: loader
          KEY_PASSWORD: changeit
        run: ./gradlew clean assembleDebug assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eliteloaders-apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: ELITELOADER APK Release ${{ github.run_number }}
          body: |
            ELITELOADER built with the verified EliteSDK release AAR.
            - Release APK: signed CI release build
            - Debug APK: included for testing
            - ABI: arm64-v8a
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          make_latest: true
